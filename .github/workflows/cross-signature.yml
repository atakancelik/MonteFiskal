name: cross-signature

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cross-signature:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.5"
          extensions: bcmath, dom, libxml, mbstring, openssl
          coverage: none
      - name: .NET signs, PHP verifies, and the reverse; identical bytes
        run: tools/cross-signature/run.sh "${{ runner.temp }}/cross-signature"
