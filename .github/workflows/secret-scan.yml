name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Self-test of the scanner
        run: python3 -I -m unittest discover -s tools/secret-scan/tests
      - name: No private keys, PKCS#12 files, passwords or certificate files in the tree
        run: python3 -I tools/secret-scan/secret_scan.py
