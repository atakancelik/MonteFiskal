name: ci-tools

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Catalog generator and drift check tests
        run: python3 -I -m unittest discover -s tools/catalog/tests
      - name: The committed catalog matches the bundled XSD
        run: |
          python3 -I tools/catalog/generate_catalog.py \
            --xsd schemas/fs-v1/2026-11/official/eficg-fiscalization-service.xsd \
            --wsdl schemas/fs-v1/2026-11/official/FiscalizationService.wsdl \
            --generated-on "$(python3 -c 'import json;print(json.load(open("schemas/fs-v1/2026-11/message-catalog.json"))["meta"]["generatedOn"])')" \
            --out "$RUNNER_TEMP/message-catalog.json"
          diff -u schemas/fs-v1/2026-11/message-catalog.json "$RUNNER_TEMP/message-catalog.json"
      - name: Bundled schemas match their digests
        run: cd schemas/fs-v1/2026-11/official && sha256sum -c ../SHA256SUMS
