name: ci-php

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.5"
          extensions: bcmath, curl, dom, libxml, mbstring, openssl, zip, sodium
          coverage: none
          tools: composer:v2
      - name: Composer validate
        run: |
          composer validate --strict --no-check-lock
          composer validate --strict --no-check-lock --no-check-version plugins/montefiskal-woocommerce/composer.json
      - name: Install development tools
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Lint
        run: find src/php plugins/montefiskal-woocommerce tests/php -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null
      - name: Coding standard (PSR-12)
        run: vendor/bin/phpcs
      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - name: Unit, vector and fake-service tests
        env:
          MONTEFISKAL_VECTOR_LOG: ${{ runner.temp }}/php-vectors.log
        run: vendor/bin/phpunit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: php-vector-log
          path: ${{ runner.temp }}/php-vectors.log
          if-no-files-found: error
