name: ci-dotnet

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  build-test-pack:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore MonteFiskal.slnx
      - name: Build (warnings are errors)
        run: dotnet build MonteFiskal.slnx -c Release --no-restore
      - name: Unit, vector and fake-service tests
        env:
          MONTEFISKAL_VECTOR_LOG: ${{ runner.temp }}/dotnet-vectors.log
        run: dotnet test --project tests/dotnet/MonteFiskal.Tests -c Release --no-build
      - name: efitest scenarios compile and skip without secrets
        run: dotnet test --project tests/dotnet/MonteFiskal.IntegrationTests -c Release --no-build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dotnet-vector-log
          path: ${{ runner.temp }}/dotnet-vectors.log
          if-no-files-found: error
