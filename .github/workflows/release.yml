name: release

on:
  push:
    tags: ["v*.*.*"]
  # For maintainers who cannot push a tag: creates the tag v<version> on the dispatched commit (main) and publishes.
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v, equal to the plugin header and a CHANGELOG entry (for example 0.2.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.5"
          extensions: bcmath, dom, mbstring, openssl, zip, sodium
          coverage: none
      - name: Version from the tag or the input
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "dispatch the release from main" >&2; exit 1; }
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "bad version: $VERSION" >&2; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Plugin header matches the tag
        run: |
          grep -q "const MONTEFISKAL_WC_VERSION = '$VERSION';" plugins/montefiskal-woocommerce/montefiskal-woocommerce.php
      - name: Release note states whether fiscal behaviour changed
        run: |
          grep -A40 "^## \[$VERSION\]" CHANGELOG.md | grep -Eq "^Fiscal behaviour changed: (yes|no)"
      - name: Plugin zip
        run: tools/plugin/build-zip.sh dist
      - name: Checksums
        run: cd dist && sha256sum *.zip > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist
          if-no-files-found: error

  publish:
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: ${{ startsWith(needs.build.outputs.version, '0.') }}
          files: dist/*
          generate_release_notes: false
          body: |
            See CHANGELOG.md for the release note, including whether fiscal behaviour changed.
            Distributed through GitHub only: use the source at this tag (.NET project references, Composer vcs repository) or the plugin zip.
