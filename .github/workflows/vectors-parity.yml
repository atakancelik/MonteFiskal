name: vectors-parity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Vector structure, rule and question references
        run: python3 -I tools/vectors/check_vectors.py --repo .

  dotnet:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - env:
          MONTEFISKAL_VECTOR_LOG: ${{ runner.temp }}/dotnet.log
        run: dotnet test --project tests/dotnet/MonteFiskal.Tests -c Release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parity-dotnet
          path: ${{ runner.temp }}/dotnet.log

  php:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.5"
          extensions: bcmath, dom, libxml, mbstring, openssl, zip
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - env:
          MONTEFISKAL_VECTOR_LOG: ${{ runner.temp }}/php.log
        run: vendor/bin/phpunit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parity-php
          path: ${{ runner.temp }}/php.log

  compare:
    runs-on: ubuntu-24.04
    needs: [dotnet, php]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: parity-*
          path: logs
          merge-multiple: true
      - name: Both languages ran every vector ID
        run: python3 -I tools/vectors/parity.py logs/dotnet.log logs/php.log
